<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#DCDCDC"/>
      <stop offset="100%" stop-color="#AAAAAA"/>
    </linearGradient>
  </defs>

  <!-- Outer Dark Glow & Ring -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#262626" stroke-width="3"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="#3A3A3A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="200" cy="200" r="166" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Compass / Star Accent Top -->
  <path d="M200 44 L203 54 L200 64 L197 54 Z" fill="#888888"/>
  <circle cx="200" cy="54" r="1.5" fill="#FFFFFF"/>

  <!-- Wings / Horizon Line Behind Monogram -->
  <path d="M78 200 C 130 196, 170 198, 190 200" stroke="#333333" stroke-width="1.2" fill="none"/>
  <path d="M210 200 C 230 198, 270 196, 322 200" stroke="#333333" stroke-width="1.2" fill="none"/>

  <!-- Central GA Serif Monogram -->
  <g font-family="'Newsreader', 'Playfair Display', 'Georgia', 'Times New Roman', serif" font-weight="500" fill="url(#goldGrad)" text-anchor="middle">
    <!-- Main GA Monogram -->
    <text x="200" y="222" font-size="108" letter-spacing="4">GA</text>
  </g>

  <!-- Editorial Subtitle Arc / Bottom Text -->
  <g font-family="'Inter', system-ui, sans-serif" font-size="9" letter-spacing="4" fill="#777777" text-anchor="middle" font-weight="500">
    <text x="200" y="278">GHANSHYAM ACHARYA</text>
    <text x="200" y="296" fill="#555555" font-size="7.5" letter-spacing="3">AVIATION SAFETY &bull; NEPAL</text>
  </g>

  <!-- Compass / Star Accent Bottom -->
  <circle cx="200" cy="336" r="2" fill="#555555"/>
</svg>
